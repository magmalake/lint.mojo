name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true
      tools-ref: "release-check"

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      # The unit tests run in the stable / ubuntu-latest job below.
      task: ""
      tools-ref: "release-check"

  test:
    needs: release
    if: ${{ !cancelled() }}
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        env: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["stable"]' || '["default", "stable"]') }}
    steps:
      # The corpus is threads.example's programs, which import `threads`;
      # `--lsp` mode resolves those imports through `-I ../threads.mojo/src`,
      # so the sibling is laid out next to this checkout.
      - uses: actions/checkout@v4
        with:
          path: lint.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and pixi changed how
          # it hashes source dependencies after it, so a newer pixi rejects the
          # committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          manifest-path: lint.mojo/pixi.toml
          environments: ${{ matrix.env }}

      # Unit tests, then the corpus in text mode and in `--lsp` mode. The
      # latter runs `mojo-lsp-server` from the environment (the `mojo`
      # package on stable, `modular` on nightly).
      - name: Unit tests and corpus
        working-directory: lint.mojo
        run: pixi run -e ${{ matrix.env }} check

  # Consumers install this tin as a source dependency, so `mojolint` is built
  # on whatever machine builds their environment — and that environment is then
  # cached and restored on other machines. `mojo build` targets the host CPU by
  # default, so a binary built on an AVX-512 runner and restored on one without
  # it died with `Illegal instruction`. The manifest pins `--target-cpu` to a
  # baseline; this job proves the pin reached the packaged binary.
  portable:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    name: portable binary / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lint.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: lint.mojo/pixi.toml
          environments: stable

      # The tin, built the way a consumer's `pixi install` builds it.
      - name: Build the tin
        working-directory: lint.mojo
        run: pixi build --output-dir dist

      # The linux-64 floor is x86-64-v2, which has no VEX encoding at all: any
      # `ymm` (AVX) or `zmm` (AVX-512) register in the disassembly means the
      # pin stopped taking effect and the binary is host-specific again.
      - name: mojolint is CPU-portable and runs
        working-directory: lint.mojo
        run: |
          set -euo pipefail
          for tool in objdump unzip zstd; do
            command -v "$tool" >/dev/null && continue
            sudo apt-get update -qq
            sudo apt-get install -y -qq binutils unzip zstd
            break
          done

          conda=$(find dist -name 'lint-mojo-*.conda' | head -1)
          echo "package: $conda"
          rm -rf /tmp/tin && mkdir -p /tmp/tin
          unzip -q -o "$conda" -d /tmp/tin
          tar --zstd -xf /tmp/tin/pkg-lint-mojo-*.tar.zst -C /tmp/tin
          # `$ORIGIN/../lib` is where the binary looks for
          # libKGENCompilerRTShared.so; point it at the environment that ships
          # it, the way an installed tin sits next to its run-dependencies.
          ln -sfn "$PWD/.pixi/envs/stable/lib" /tmp/tin/lib

          echo "runner CPU: $( (grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -xE 'avx|avx2|avx512f' | tr '\n' ' ') || echo 'no avx')"
          objdump -d /tmp/tin/bin/mojolint > /tmp/mojolint.S
          status=0
          for reg in zmm ymm; do
            n=$(grep -c "%$reg" /tmp/mojolint.S || true)
            echo "%$reg uses: $n"
            if [ "$n" != 0 ]; then
              echo "::error::mojolint uses %$reg registers — the --target-cpu pin is not reaching the build"
              grep -m5 "%$reg" /tmp/mojolint.S
              status=1
            fi
          done
          [ "$status" = 0 ] || exit 1

          # And it runs here: the linter over its own sources, which are clean.
          /tmp/tin/bin/mojolint src
          echo "mojolint ran and reported no findings"

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() }}
    needs: [release, release-check, test, portable]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
